{% extends "base.html" %}

{% block title %}Application Pipeline - Career Aggregator{% endblock %}

{% block content %}
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
  <div class="page-title" style="margin-bottom:0;">Application Pipeline</div>
  <div style="display:flex; gap:0.5rem;">
    <button onclick="openAddJobModal()" style="font-size:0.85rem; padding:0.35rem 0.85rem;">+ Add Job</button>
    <button onclick="exportPipelineCSV()" class="secondary" style="font-size:0.85rem; padding:0.35rem 0.85rem;">Export CSV</button>
  </div>
</div>

<style>
  /* ── Board ─────────────────────────────────────────────────────────────── */
  .kanban-board {
    display: flex;
    gap: 0.65rem;
    overflow-x: auto;
    align-items: flex-start;
    padding-bottom: 0.5rem;
    margin: 0 -1rem;
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .kanban-col {
    flex: 1 1 0;
    min-width: 170px;
    background: #f0f2f5;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
  }

  .kanban-col.drag-over {
    background: #dde5f5;
    outline: 2px dashed #3498db;
    outline-offset: -2px;
  }

  .kanban-col-header {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 0.7rem 0.45rem;
    border-bottom: 1px solid rgba(0,0,0,0.06);
    border-radius: 8px 8px 0 0;
  }

  .kanban-col-stripe {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .kanban-col-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: #555;
    flex: 1;
  }

  .kanban-col-count {
    font-size: 0.68rem;
    font-weight: 700;
    background: rgba(0,0,0,0.09);
    color: #666;
    border-radius: 8px;
    padding: 0.05rem 0.4rem;
    min-width: 18px;
    text-align: center;
  }

  .kanban-cards {
    padding: 0.45rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    min-height: 80px;
    overflow-y: auto;
    max-height: 65vh;
  }

  .kanban-empty {
    text-align: center;
    color: #bbb;
    font-size: 0.75rem;
    padding: 1.2rem 0.5rem;
    border: 2px dashed #d8dce2;
    border-radius: 6px;
    pointer-events: none;
  }

  /* ── Rejected tray ──────────────────────────────────────────────────────── */
  .rejected-section {
    margin-top: 0.75rem;
    background: #f0f2f5;
    border-radius: 8px;
  }

  .rejected-section.drag-over {
    background: #fdf0ef;
    outline: 2px dashed #e74c3c;
    outline-offset: -2px;
  }

  .rejected-cards {
    display: flex;
    gap: 0.35rem;
    overflow-x: auto;
    padding: 0.45rem;
    min-height: 60px;
    align-items: flex-start;
  }

  .rejected-cards .kanban-empty { flex: 1; }
  .rejected-cards .k-card { flex: 0 0 192px; }

  /* ── Cards ─────────────────────────────────────────────────────────────── */
  .k-card {
    background: white;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
    border-top: 2px solid #3498db;
    padding: 0.4rem 0.5rem 0.35rem;
    cursor: grab;
    transition: box-shadow 0.12s, transform 0.1s;
    position: relative;
  }

  .k-card:hover {
    box-shadow: 0 3px 8px rgba(0,0,0,0.11), 0 0 0 1px rgba(0,0,0,0.04);
    transform: translateY(-1px);
  }

  .k-card:active { cursor: grabbing; }

  .k-card.dragging {
    opacity: 0.25;
    transform: scale(0.95);
    box-shadow: none;
  }

  .k-card.applied      { border-top-color: #27ae60; }
  .k-card.rejected     { border-top-color: #e74c3c; opacity: 0.7; }
  .k-card.interviewing { border-top-color: #f39c12; }
  .k-card.offer        { border-top-color: #8e44ad; }

  .k-title {
    font-size: 0.78rem;
    font-weight: 600;
    color: #2c3e50;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.1rem;
  }

  .k-company {
    font-size: 0.68rem;
    color: #7f8c8d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 0.25rem;
  }

  .k-actions {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding-top: 0.25rem;
    border-top: 1px solid #f2f3f5;
  }

  .k-link {
    font-size: 0.68rem;
    color: #3498db;
    text-decoration: none;
    font-weight: 500;
  }
  .k-link:hover { text-decoration: underline; }

  .k-del {
    margin-left: auto;
    font-size: 0.7rem;
    color: #ccc;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.05rem 0.25rem;
    border-radius: 3px;
    line-height: 1;
    transition: color 0.12s, background 0.12s;
  }
  .k-del:hover { color: #e74c3c; background: #fdf0ef; }

  /* ── Add Job Modal ──────────────────────────────────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-box {
    background: white;
    border-radius: 10px;
    padding: 1.5rem;
    width: 400px;
    max-width: 92vw;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  }

  .modal-box h3 {
    margin: 0 0 1rem;
    font-size: 1rem;
    color: #2c3e50;
  }

  .modal-field {
    margin-bottom: 0.75rem;
  }

  .modal-field label {
    font-size: 0.78rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 0.25rem;
  }

  .modal-field input,
  .modal-field select,
  .modal-field textarea {
    font-size: 0.85rem;
    padding: 0.45rem 0.6rem;
  }

  .modal-field textarea {
    min-height: 60px;
    resize: vertical;
  }

  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
    margin-top: 1rem;
  }

  .modal-actions button {
    font-size: 0.85rem;
    padding: 0.4rem 1rem;
  }
</style>

<!-- Main 4-column kanban board -->
<div id="pipeline" class="kanban-board">
  <p class="text-muted" style="padding:1rem;">Loading pipeline…</p>
</div>

<!-- Rejected tray -->
<div id="rejected-section" class="rejected-section" style="display:none;">
  <div class="kanban-col-header" style="border-radius:8px 8px 0 0;">
    <span class="kanban-col-stripe" style="background:#e74c3c;"></span>
    <span class="kanban-col-title">Rejected</span>
    <span class="kanban-col-count" id="count-rejected">0</span>
  </div>
  <div id="rejected-cards" class="rejected-cards">
    <div class="kanban-empty">Drop cards here</div>
  </div>
</div>

<!-- Add Job Modal -->
<div id="add-job-modal" class="modal-overlay" style="display:none;" onclick="handleModalClick(event)">
  <div class="modal-box">
    <h3>Add Job Manually</h3>
    <form id="add-job-form" onsubmit="submitAddJob(event)">
      <div class="modal-field">
        <label>Position Title *</label>
        <input type="text" id="aj-title" placeholder="e.g. Senior Learning Designer" required>
      </div>
      <div class="modal-field">
        <label>Company *</label>
        <input type="text" id="aj-company" placeholder="e.g. Acme Corp" required>
      </div>
      <div class="modal-field">
        <label>Job URL *</label>
        <input type="url" id="aj-url" placeholder="https://…" required>
      </div>
      <div class="modal-field">
        <label>Status</label>
        <select id="aj-status">
          <option value="saved">Saved</option>
          <option value="applied">Applied</option>
          <option value="interviewing">Interviewing</option>
          <option value="offer">Offer</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Salary <span style="font-weight:400;color:#aaa;">(optional)</span></label>
        <input type="text" id="aj-salary" placeholder="e.g. $90,000/yr">
      </div>
      <div class="modal-field">
        <label>Posting <span style="font-weight:400;color:#aaa;">(optional: paste it, or leave blank to fetch it from the URL)</span></label>
        <textarea id="aj-posting" rows="5" placeholder="Paste the full job posting…"></textarea>
      </div>
      <div class="modal-field">
        <label>Notes <span style="font-weight:400;color:#aaa;">(optional)</span></label>
        <textarea id="aj-notes" placeholder="Any notes…"></textarea>
      </div>
      <div id="aj-error" style="font-size:0.8rem;color:#e74c3c;margin-bottom:0.5rem;display:none;"></div>
      <div class="modal-actions">
        <button type="button" class="secondary" onclick="closeAddJobModal()">Cancel</button>
        <button type="submit" id="aj-submit">Add to Pipeline</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Inside the portfolio studio, a card can hand its job to Render.
  const IN_STUDIO = window.parent !== window;
  function prepareJob(id) { parent.postMessage({ source: 'search', action: 'prepare', pipelineId: id }, '*'); }

  let pipelineData   = null;
  let draggingJobId  = null;
  let draggingStatus = null;

  const STATUS_META = {
    saved:        { label: 'Saved',        color: '#3498db' },
    applied:      { label: 'Applied',      color: '#27ae60' },
    interviewing: { label: 'Interviewing', color: '#f39c12' },
    offer:        { label: 'Offer',        color: '#8e44ad' },
    rejected:     { label: 'Rejected',     color: '#e74c3c' },
  };

  const MAIN_STATUSES = ['saved', 'applied', 'interviewing', 'offer'];
  const ALL_STATUSES  = ['saved', 'applied', 'interviewing', 'offer', 'rejected'];

  // ── Load & render ─────────────────────────────────────────────────────────

  function loadPipeline() {
    fetch('/api/pipeline')
      .then(r => r.json())
      .then(data => { pipelineData = data; renderBoard(); })
      .catch(() => {
        document.getElementById('pipeline').innerHTML =
          '<p class="text-danger" style="padding:1rem;">Error loading pipeline</p>';
      });
  }

  function renderBoard() {
    const board = document.getElementById('pipeline');
    board.innerHTML = '';

    MAIN_STATUSES.forEach(status => {
      const jobs = pipelineData[status] || [];
      const meta = STATUS_META[status];

      const col = document.createElement('div');
      col.className = 'kanban-col';
      col.dataset.status = status;
      col.innerHTML = `
        <div class="kanban-col-header">
          <span class="kanban-col-stripe" style="background:${meta.color};"></span>
          <span class="kanban-col-title">${meta.label}</span>
          <span class="kanban-col-count" id="count-${status}">${jobs.length}</span>
        </div>`;

      const cardsEl = document.createElement('div');
      cardsEl.className = 'kanban-cards';
      if (!jobs.length) {
        cardsEl.innerHTML = '<div class="kanban-empty">Drop cards here</div>';
      } else {
        jobs.forEach(job => cardsEl.appendChild(buildCard(job, status)));
      }

      wireDropZone(col, status);
      col.appendChild(cardsEl);
      board.appendChild(col);
    });

    // Rejected tray
    const rejectedJobs    = pipelineData['rejected'] || [];
    const rejectedSection = document.getElementById('rejected-section');
    const rejectedCards   = document.getElementById('rejected-cards');
    document.getElementById('count-rejected').textContent = rejectedJobs.length;
    rejectedSection.style.display = '';
    rejectedCards.innerHTML = '';
    if (!rejectedJobs.length) {
      rejectedCards.innerHTML = '<div class="kanban-empty">Drop cards here</div>';
    } else {
      rejectedJobs.forEach(job => rejectedCards.appendChild(buildCard(job, 'rejected')));
    }
    wireDropZone(rejectedSection, 'rejected');
  }

  function wireDropZone(el, status) {
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', e => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      if (draggingJobId && status !== draggingStatus)
        updateJobStatus(draggingJobId, status);
    });
  }

  function buildCard(job, status) {
    const card = document.createElement('div');
    card.className = `k-card ${status}`;
    card.dataset.jobId = job.id;
    card.draggable = true;

    card.innerHTML = `
      <div class="k-title" title="${escH(job.title)}">${escH(job.title)}</div>
      <div class="k-company" title="${escH(job.company)}">${escH(job.company)}</div>
      <div class="k-actions">
        <a class="k-link" href="${escH(job.url)}" target="_blank">View ↗</a>
        ${IN_STUDIO ? `<button class="k-prepare" onclick="prepareJob(${job.id})" title="Resume suggestions and a cover letter for this job">Prepare →</button>` : ''}
        <button class="k-del" onclick="deleteJob(${job.id})" title="Remove">✕</button>
      </div>`;

    card.addEventListener('dragstart', e => {
      draggingJobId  = job.id;
      draggingStatus = status;
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => card.classList.add('dragging'));
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      draggingJobId  = null;
      draggingStatus = null;
    });

    return card;
  }

  // ── Pipeline actions ──────────────────────────────────────────────────────

  function updateJobStatus(jobId, newStatus) {
    fetch(`/api/pipeline/${jobId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: newStatus}),
    })
    .then(r => r.json())
    .then(() => loadPipeline())
    .catch(() => alert('Error updating job status'));
  }

  function deleteJob(jobId) {
    if (!confirm('Remove this job from pipeline?')) return;
    fetch(`/api/pipeline/${jobId}`, {method: 'DELETE'})
      .then(() => loadPipeline())
      .catch(() => alert('Error removing job'));
  }

  // ── Add Job Modal ─────────────────────────────────────────────────────────

  function openAddJobModal() {
    document.getElementById('add-job-form').reset();
    document.getElementById('aj-error').style.display = 'none';
    document.getElementById('add-job-modal').style.display = 'flex';
    document.getElementById('aj-title').focus();
  }

  function closeAddJobModal() {
    document.getElementById('add-job-modal').style.display = 'none';
  }

  function handleModalClick(e) {
    if (e.target === document.getElementById('add-job-modal')) closeAddJobModal();
  }

  function submitAddJob(e) {
    e.preventDefault();
    const btn     = document.getElementById('aj-submit');
    const errEl   = document.getElementById('aj-error');
    const payload = {
      title:   document.getElementById('aj-title').value.trim(),
      company: document.getElementById('aj-company').value.trim(),
      url:     document.getElementById('aj-url').value.trim(),
      status:  document.getElementById('aj-status').value,
      salary:  document.getElementById('aj-salary').value.trim() || null,
      notes:   document.getElementById('aj-notes').value.trim()  || null,
      posting_text: document.getElementById('aj-posting').value.trim() || null,
    };

    btn.disabled   = true;
    btn.textContent = 'Adding…';
    errEl.style.display = 'none';

    fetch('/api/pipeline/add', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) throw new Error(d.detail || 'Error adding job');
      closeAddJobModal();
      loadPipeline();
    })
    .catch(err => {
      errEl.textContent   = err.message;
      errEl.style.display = 'block';
    })
    .finally(() => {
      btn.disabled    = false;
      btn.textContent = 'Add to Pipeline';
    });
  }

  // Esc key closes modal
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAddJobModal();
  });

  // ── Export CSV ────────────────────────────────────────────────────────────

  function exportPipelineCSV() {
    if (!pipelineData) { alert('No pipeline data loaded yet.'); return; }
    const all = ALL_STATUSES.flatMap(s => (pipelineData[s] || []).map(j => ({...j, status: s})));
    if (!all.length) { alert('Pipeline is empty.'); return; }
    const lines = [['Title','Company','Location','Salary','Status','Saved Date','Applied Date','Notes','URL'].join(',')];
    all.forEach(j => lines.push([
      csvCell(j.title), csvCell(j.company), csvCell(j.location), csvCell(j.salary),
      csvCell(j.status),
      csvCell(j.saved_date   ? new Date(j.saved_date).toLocaleDateString()   : ''),
      csvCell(j.applied_date ? new Date(j.applied_date).toLocaleDateString() : ''),
      csvCell(j.notes), csvCell(j.url),
    ].join(',')));
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(new Blob([lines.join('\n')], {type: 'text/csv;charset=utf-8;'})),
      download: 'pipeline_export.csv',
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function csvCell(v) { const s = (v == null ? '' : String(v)).replace(/"/g, '""'); return `"${s}"`; }

  function escH(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.addEventListener('DOMContentLoaded', loadPipeline);
</script>
{% endblock %}
