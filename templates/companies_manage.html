{% extends "base.html" %}

{% block title %}Manage Companies - Career Aggregator{% endblock %}

{% block content %}
<div class="page-title">Manage Companies</div>

<div class="company-tools-grid">

  <div class="card">
    <h3 style="margin-bottom:0.75rem;">Add Company</h3>
    <p class="text-muted" style="font-size:0.85rem;margin-bottom:0.75rem;">Career URL is optional — add it later via Edit if needed.</p>
    <form id="add-company-form">
      <div style="display:flex;flex-direction:column;gap:0.4rem;">
        <input type="text" id="company-name" name="name" placeholder="Company name" required style="margin:0;">
        <input type="url" id="company-url" name="career_url" placeholder="Career URL (optional)" style="margin:0;">
      </div>
      <div style="margin-top:0.5rem;">
        <button type="submit" id="add-btn">Add</button>
      </div>
      <div id="add-status" style="margin-top:0.5rem;font-size:0.85rem;"></div>
    </form>
  </div>

  <div class="card">
    <h3 style="margin-bottom:0.75rem;">Import from CSV</h3>
    <p class="text-muted" style="font-size:0.85rem;margin-bottom:0.75rem;">CSV needs a <code>name</code> column. <code>career_url</code> is optional.</p>
    <div style="display:flex;gap:0.5rem;align-items:flex-start;">
      <input type="file" id="csv-file" accept=".csv" style="margin:0;padding:0.5rem;font-size:0.85rem;">
      <button onclick="uploadCSV()" style="white-space:nowrap;flex-shrink:0;">Upload</button>
    </div>
    <div id="csv-status" style="margin-top:0.5rem;font-size:0.85rem;"></div>
  </div>

</div>

<div id="companies-list"></div>

<style>
  .sortable { cursor:pointer; user-select:none; white-space:nowrap; }
  .sortable:hover { background:#f0f3f5; }
  .sort-ind { font-size:0.75rem; color:#aaa; margin-left:0.25rem; }
  th.col-score { width:38px; text-align:center; }
  td.col-score { text-align:center; font-size:0.82rem; color:#555; }
  td.col-score input { width:36px; text-align:center; padding:0.2rem; margin:0; font-size:0.82rem; }
</style>

<script>
  const companiesData = {};
  let companiesList  = [];
  let sortCol = 'name';
  let sortDir = 1;

  function sortBy(col) {
    if (sortCol === col) {
      sortDir *= -1;
    } else {
      sortCol = col;
      sortDir = 1;
    }
    renderTable();
  }

  function sortInd(col) {
    if (sortCol !== col) return '⇅';
    return sortDir === 1 ? '↑' : '↓';
  }

  function scoreVal(c, col) {
    const v = c[col];
    return v == null ? -1 : v;
  }

  function renderTable() {
    const sorted = [...companiesList].sort((a, b) => {
      let av, bv;
      if (sortCol === 'name') {
        av = (a.name || '').toLowerCase();
        bv = (b.name || '').toLowerCase();
      } else if (sortCol === 'career_url') {
        av = a.career_url ? 1 : 0;
        bv = b.career_url ? 1 : 0;
      } else if (sortCol === 'is_skipped') {
        av = a.is_skipped ? 1 : 0;
        bv = b.is_skipped ? 1 : 0;
      } else {
        av = scoreVal(a, sortCol);
        bv = scoreVal(b, sortCol);
      }
      if (av < bv) return -sortDir;
      if (av > bv) return sortDir;
      return 0;
    });

    const tbody = document.getElementById('companies-tbody');
    if (!tbody) return;
    tbody.innerHTML = '';
    sorted.forEach(c => tbody.appendChild(buildRow(c)));

    // Update sort indicators
    ['name','career_url','score_a','score_m','score_p','is_skipped'].forEach(col => {
      const el = document.querySelector(`.sort-ind[data-col="${col}"]`);
      if (el) el.textContent = sortInd(col);
    });
  }

  function loadCompanies() {
    fetch('/api/companies')
      .then(r => r.json())
      .then(companies => {
        const list = document.getElementById('companies-list');
        if (companies.length === 0) {
          list.innerHTML = '<p class="text-muted">No companies yet.</p>';
          return;
        }
        companiesList = companies;
        companies.forEach(c => { companiesData[c.id] = c; });

        const skipped = companies.filter(c => c.is_skipped).length;
        const countHtml = skipped > 0
          ? `${companies.length} companies &nbsp;&middot;&nbsp; <span style="color:#f39c12;">${skipped} skipped</span>`
          : `${companies.length} companies`;

        list.innerHTML = `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;">
              <span class="text-muted" style="font-size:0.9rem;" id="companies-count">${countHtml}</span>
            </div>
            <table>
              <thead>
                <tr>
                  <th class="sortable" onclick="sortBy('name')">Company <span class="sort-ind" data-col="name">${sortInd('name')}</span></th>
                  <th class="sortable" onclick="sortBy('career_url')">Career Page <span class="sort-ind" data-col="career_url">${sortInd('career_url')}</span></th>
                  <th class="col-score sortable" onclick="sortBy('score_a')" title="Advocacy: internal connections at this company (0–3)">A <span class="sort-ind" data-col="score_a">${sortInd('score_a')}</span></th>
                  <th class="col-score sortable" onclick="sortBy('score_m')" title="Motivation: personal interest in this company (0–3)">M <span class="sort-ind" data-col="score_m">${sortInd('score_m')}</span></th>
                  <th class="col-score sortable" onclick="sortBy('score_p')" title="Postings: relevant active job postings (0–3)">P <span class="sort-ind" data-col="score_p">${sortInd('score_p')}</span></th>
                  <th class="sortable" onclick="sortBy('is_skipped')">Status <span class="sort-ind" data-col="is_skipped">${sortInd('is_skipped')}</span></th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="companies-tbody"></tbody>
            </table>
          </div>`;

        renderTable();
      });
  }

  function buildRow(company) {
    const tr = document.createElement('tr');
    tr.id = `row-${company.id}`;
    if (company.is_skipped) tr.style.opacity = '0.55';

    const urlCell = company.career_url
      ? `<a href="${escH(company.career_url)}" target="_blank" style="font-size:0.85rem;">Link ↗</a>`
      : `<span class="text-muted">—</span>`;

    const skipBadge = company.is_skipped
      ? `<span style="font-size:0.72rem;background:#f39c12;color:white;padding:0.1rem 0.45rem;border-radius:10px;font-weight:600;">Skipped</span>`
      : `<span style="font-size:0.72rem;color:#aaa;">Active</span>`;

    const skipBtn = company.is_skipped
      ? `<button class="icon-button" style="color:#f39c12;" onclick="toggleSkip(${company.id})">Unskip</button>`
      : `<button class="icon-button" onclick="toggleSkip(${company.id})">Skip</button>`;

    const scoreCell = v => v != null ? v : '<span class="text-muted">—</span>';

    tr.innerHTML = `
      <td>${escH(company.name)}</td>
      <td>${urlCell}</td>
      <td class="col-score">${scoreCell(company.score_a)}</td>
      <td class="col-score">${scoreCell(company.score_m)}</td>
      <td class="col-score">${scoreCell(company.score_p)}</td>
      <td>${skipBadge}</td>
      <td>
        <button class="icon-button" onclick="startEdit(${company.id})">Edit</button>
        ${skipBtn}
        <button class="icon-button danger" onclick="deleteCompany(${company.id})">Delete</button>
      </td>`;
    return tr;
  }

  function toggleSkip(id) {
    fetch(`/api/companies/${id}/skip`, { method: 'POST' })
      .then(r => r.json().then(data => ({ ok: r.ok, data })))
      .then(({ ok, data }) => {
        if (!ok) { alert(data.detail || 'Error toggling skip'); return; }
        companiesData[id] = data;
        companiesList = companiesList.map(c => c.id === id ? data : c);
        renderTable();
        updateCount();
      })
      .catch(e => alert('Error: ' + e));
  }

  function startEdit(id) {
    const c = companiesData[id];
    if (!c) return;
    const tr = document.getElementById(`row-${id}`);
    if (!tr) return;
    tr.innerHTML = `
      <td><input type="text" id="edit-name-${id}" value="${escH(c.name)}" style="margin:0;width:100%;"></td>
      <td><input type="url" id="edit-url-${id}" value="${escH(c.career_url||'')}" style="margin:0;width:100%;"></td>
      <td class="col-score"><input type="number" id="edit-a-${id}" value="${c.score_a ?? ''}" min="0" max="3" title="Advocacy: 0–3 internal connections"></td>
      <td class="col-score"><input type="number" id="edit-m-${id}" value="${c.score_m ?? ''}" min="0" max="3" title="Motivation: 0–3 personal interest"></td>
      <td class="col-score"><input type="number" id="edit-p-${id}" value="${c.score_p ?? ''}" min="0" max="3" title="Postings: 0–3 relevant active listings"></td>
      <td></td>
      <td>
        <button class="icon-button" onclick="saveEdit(${id})">Save</button>
        <button class="icon-button" onclick="cancelEdit(${id})">Cancel</button>
      </td>`;
    document.getElementById(`edit-name-${id}`).focus();
  }

  function cancelEdit(id) {
    const tr = document.getElementById(`row-${id}`);
    if (tr) tr.replaceWith(buildRow(companiesData[id]));
  }

  function saveEdit(id) {
    const name      = document.getElementById(`edit-name-${id}`).value.trim();
    const career_url = document.getElementById(`edit-url-${id}`).value.trim();
    const aRaw      = document.getElementById(`edit-a-${id}`).value.trim();
    const mRaw      = document.getElementById(`edit-m-${id}`).value.trim();
    const pRaw      = document.getElementById(`edit-p-${id}`).value.trim();
    if (!name) return;

    const body = { name, career_url };
    if (aRaw !== '') body.score_a = parseInt(aRaw);
    if (mRaw !== '') body.score_m = parseInt(mRaw);
    if (pRaw !== '') body.score_p = parseInt(pRaw);

    fetch(`/api/companies/${id}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    })
    .then(r => r.json().then(data => ({ok: r.ok, data})))
    .then(({ok, data}) => {
      if (!ok) { alert(data.detail || 'Save failed'); return; }
      companiesData[id] = data;
      companiesList = companiesList.map(c => c.id === id ? data : c);
      renderTable();
    })
    .catch(e => alert('Error: ' + e));
  }

  function deleteCompany(id) {
    const c = companiesData[id];
    if (!c || !confirm(`Delete "${c.name}"?`)) return;
    fetch(`/api/companies/${id}`, {method: 'DELETE'})
      .then(r => {
        if (r.ok || r.status === 204) {
          delete companiesData[id];
          companiesList = companiesList.filter(c => c.id !== id);
          renderTable();
          updateCount();
        } else {
          alert('Error deleting company');
        }
      })
      .catch(e => alert('Error deleting company'));
  }

  function updateCount() {
    const countEl = document.getElementById('companies-count');
    if (!countEl) return;
    const total = companiesList.length;
    const skipped = companiesList.filter(c => c.is_skipped).length;
    countEl.innerHTML = skipped > 0
      ? `${total} companies &nbsp;&middot;&nbsp; <span style="color:#f39c12;">${skipped} skipped</span>`
      : `${total} companies`;
  }

  function escH(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('add-company-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('company-name').value.trim();
    const career_url = document.getElementById('company-url').value.trim() || null;
    const btn  = document.getElementById('add-btn');
    const status = document.getElementById('add-status');

    btn.disabled = true;
    btn.textContent = 'Adding…';
    status.innerHTML = '';

    fetch('/api/companies', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, career_url})
    })
    .then(r => r.json().then(data => ({ok: r.ok, data})))
    .then(({ok, data}) => {
      if (!ok) throw new Error(data.detail || 'Unknown error');
      const urlNote = data.career_url
        ? ` — <a href="${data.career_url}" target="_blank">Link ↗</a>`
        : ' (no URL — add one via Edit)';
      status.innerHTML = `<span class="text-success">Added${urlNote}</span>`;
      document.getElementById('company-name').value = '';
      document.getElementById('company-url').value = '';
      loadCompanies();
    })
    .catch(e => {
      status.innerHTML = `<span class="text-danger">${e.message}</span>`;
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = 'Add';
    });
  });

  function uploadCSV() {
    const fileInput = document.getElementById('csv-file');
    const status = document.getElementById('csv-status');
    if (!fileInput.files.length) {
      status.innerHTML = '<span class="text-danger">Please select a CSV file first.</span>';
      return;
    }
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    status.innerHTML = '<span class="text-muted">Uploading…</span>';

    fetch('/api/companies/upload-csv', {method:'POST', body: formData})
      .then(r => r.json().then(data => ({ok: r.ok, data})))
      .then(({ok, data}) => {
        if (!ok) {
          const msg = Array.isArray(data.detail)
            ? data.detail.map(e => e.msg).join(', ')
            : (data.detail || 'Server error');
          throw new Error(msg);
        }
        let msg = `<strong>${data.added}</strong> added, <strong>${data.skipped}</strong> skipped.`;
        if (data.errors && data.errors.length)
          msg += ` <span class="text-danger">Errors: ${data.errors.join('; ')}</span>`;
        status.innerHTML = msg;
        fileInput.value = '';
        loadCompanies();
      })
      .catch(e => {
        status.innerHTML = `<span class="text-danger">Upload failed: ${e.message}</span>`;
      });
  }

  document.addEventListener('DOMContentLoaded', loadCompanies);
</script>
{% endblock %}
